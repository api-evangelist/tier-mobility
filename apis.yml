aid: tier-mobility
name: TIER
description: >-
  TIER Mobility was a Berlin-headquartered shared electric micromobility operator founded in 2018 by Lawrence Leuschner,
  Julian Blessin, and Matthias Laug, providing e-scooter, e-bike, and e-moped sharing across European and Middle Eastern
  cities. In March 2024, TIER merged with Amsterdam-based Dott to form the combined European micromobility champion that
  now trades under the Dott brand on ridedott.com, operating in 400+ cities across roughly 22 countries including
  Germany, France, the United Kingdom, Italy, Spain, the Netherlands, Belgium, Sweden, Norway, Finland, Denmark,
  Austria, Switzerland, Poland, Greece, Hungary, Israel, Saudi Arabia, Qatar, and the UAE. All public real-time data —
  fleet positions, battery levels, vehicle types, pricing plans, stations, and geofencing zones — is published via GBFS
  2.3 (General Bikeshare Feed Specification) endpoints at https://gbfs.api.ridedott.com/public/v2/{system_id}/, with one
  `system_id` per city. There is no consumer authentication or paid API tier; feeds are open data consumed by city
  regulators, MaaS aggregators, and trip-planning apps.
