  protected-resource metadata, emitted by the WordPress MCP Adapter on the corporate site for
  https://ridedott.com/wp-json/mcp/mcp-oauth-server (its authorization_servers names ridedott.com
  itself, so no third host). Everything else 404s. gbfs.api.ridedott.com answers 401 on every
  non-public path. help.ridedott.com (Elevio) and tier.app / www.tier.app return HTML for every path
  (SPA / redirect to ridedott.com home) — recorded as misses, not documents.
